# Jetson hardware configuration. Change the IPs to match the actual devices.
# All translation values use metres; all rpy values use radians.
go2:
  enabled: true
  network_interface: enP8p1s0
  robot_ip: 192.168.123.161
  domain_id: 0
  enable_control: false
lidar:
  enabled: true
  # Sensor discovery reported device type 35 (Livox SDK Mid360s).
  model: Mid360s
  ip: 192.168.1.177
  host_ip: 192.168.1.5
  frame_id: livox_frame
  publish_freq: 10.0
  # 0 = sensor_msgs/PointCloud2, 1 = Livox CustomMsg (e.g. FAST-LIO).
  xfer_format: 0
camera:
  enabled: true
  namespace: camera
  name: camera
  serial_no: '262422072409'
  # Conservative startup profiles for the currently detected USB 2 link.
  depth_profile: 480x270x15
  color_profile: 640x480x15
  enable_imu: true
  pointcloud: false
tf:
  # Enable only after measuring the mounting positions and directions.
  publish_mounts: false
  calibrated: false
  mid360:
    parent: base_link
    child: livox_frame
    xyz: null
    rpy: null
  d435i:
    parent: base_link
    child: camera_link
    xyz: null
    rpy: null
