# Jetson hardware configuration. Change the IPs to match the actual devices.
# All translation values use metres; all rpy values use radians.
go2:
  enabled: true
  network_interface: go2
  robot_ip: 192.168.123.161
  domain_id: 0
lidar:
  enabled: true
  # Sensor discovery reported device type 35 (Livox SDK Mid360s).
  model: Mid360s
  ip: 192.168.1.177
  host_ip: 192.168.1.5
  frame_id: livox_frame
  publish_freq: 10.0
  # 0 = sensor_msgs/PointCloud2, 1 = Livox CustomMsg (e.g. FAST-LIO).
  xfer_format: 0
camera:
  enabled: true
  namespace: camera
  name: camera
  serial_no: '262422072409'
  # Conservative startup profiles for the currently detected USB 2 link.
  depth_profile: 480x270x15
  color_profile: 640x480x15
  enable_imu: true
  pointcloud: false
tf:
  publish_mounts: true
  mid360:
    enabled: true
    # Factory bracket reference, checked against both IMUs on 2026-10-19.
    # Translation is relative to the BODY IMU, not base_link.
    status: reference
    source: https://github.com/koide3/glim/issues/309
    parent: imu
    child: livox_frame
    xyz: [0.1870, 0.0, 0.0803]
    rpy: [0.0, 0.22689280275926285, 0.0]
    yaw_verified: false
  d435i:
    enabled: false
    status: unconfigured
    parent: base_link
    child: camera_link
    xyz: null
    rpy: null
