# Jetson hardware configuration. Change the IPs to match the actual devices.
# All translation values use metres; all rpy values use radians.
go2:
  enabled: true
  network_interface: go2
  robot_ip: 192.168.123.161
  domain_id: 0
lidar:
  enabled: true
  # Sensor discovery reported device type 35 (Livox SDK Mid360s).
  model: Mid360s
  ip: 192.168.1.120
  host_ip: 192.168.1.5
  frame_id: livox_frame
  publish_freq: 10.0
  # 0 = sensor_msgs/PointCloud2, 1 = Livox CustomMsg (e.g. FAST-LIO).
  xfer_format: 0
camera:
  enabled: true
  namespace: camera
  name: camera
  serial_no: '261722076686'
  # Conservative image profiles; current camera is connected over USB 3.
  depth_profile: 480x270x15
  color_profile: 640x480x15
  enable_imu: true
  pointcloud: true
tf:
  publish_mounts: true
  mid360:
    enabled: true
    # Bracket reference; IMU comparison checked tilt, not translation.
    # Original bracket translation restored at the user request; not surveyed.
    # Translation is relative to the BODY IMU, not base_link.
    status: reference
    source: https://github.com/koide3/glim/issues/309
    parent: imu
    child: livox_frame
    xyz: [0.1870, 0.0, 0.0803]
    rpy: [0.0, 0.22689280275926285, 0.0]
    yaw_verified: false
  d435i:
    enabled: true
    # Approximate placement supplied by the user on 2026-10-22.
    # Align the housing's lateral center with Go2 front_camera.
    # Official D435i camera_link is 17.5 mm left of the housing center.
    # Preserve the current Jetson setting: x is 1 cm in front of front_camera.
    # Positive pitch tilts the forward axis down.
    status: reference
    source: Approximate current Jetson setting; housing centered laterally, 1 cm forward of Go2 front_camera, up 5 cm, tilted down 5 deg; not surveyed
    parent: front_camera
    child: camera_link
    xyz: [0.01, 0.0175, 0.05]
    rpy: [0.0, 0.08726646259971647, 0.0]
    yaw_verified: false
